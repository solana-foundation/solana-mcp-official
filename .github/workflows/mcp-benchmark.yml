name: MCP Benchmark

on:
  pull_request:
    paths:
      - 'eval/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

env:
  PNPM_VERSION: '10.30.0'

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run benchmark against prod
        run: EVAL_OUT=/tmp/benchmark pnpm dlx tsx eval/run.ts --endpoint prod=https://mcp.solana.com/mcp
      - name: Extract aggregate table
        run: |
          {
            echo '<!-- mcp-benchmark -->'
            echo '## MCP benchmark (prod, 50 questions)'
            echo ''
            sed -n '/^## Aggregate$/,/^## Questions$/p' /tmp/benchmark/index.md | sed '1d;$d'
          } > /tmp/benchmark/comment.md
          cat /tmp/benchmark/comment.md
      - name: Comment result on PR
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          existing=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" --paginate \
            --jq '.[] | select(.body | startswith("<!-- mcp-benchmark -->")) | .id' | head -1)
          if [ -n "$existing" ]; then
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${existing}" \
              -F body=@/tmp/benchmark/comment.md
          else
            gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body-file /tmp/benchmark/comment.md
          fi
